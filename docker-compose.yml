services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: hrflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrflow"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://hrflow:${POSTGRES_PASSWORD:-local_dev_only}@db:5432/hrflow
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
volumes:
  pgdata:
